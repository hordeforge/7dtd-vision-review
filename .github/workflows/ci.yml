name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a fresh push cancels the superseded in-progress run
# instead of queueing duplicate parallel jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the pipeline only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # macOS is a claimed platform for the published wheel, so it is
          # tested rather than asserted. One interpreter is enough to catch a
          # case-sensitive path, a locale-encoding, or a filesystem-behavior
          # assumption that Linux hides; the version matrix stays on Ubuntu,
          # where the three interpreters matter most.
          - os: macos-latest
            python-version: "3.13"
    steps:
      # The shared composite action owns the environment build and the gate
      # invocations, so the release workflow runs the identical suite.
      - uses: ./.github/actions/test-suite
        with:
          python-version: ${{ matrix.python-version }}

  coverage-badge:
    # Publishes the line-coverage badge to the badges branch, which
    # raw.githubusercontent serves to the README. Main pushes only: a PR gets
    # its verdict from the test job and never sees the write token this job
    # needs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.13"
      - run: uv sync --locked
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: make badge BADGE="$RUNNER_TEMP/coverage.svg"
      - name: Publish the badge to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The write-scoped token reaches git through an askpass helper that
          # reads it out of the environment, never through a remote URL: a
          # URL form persists into badge-repo/.git/config and puts the token
          # in argv of every git process (THREAT_MODEL T9). The helper lives
          # in RUNNER_TEMP and the trap removes it, so nothing about it
          # outlives the job.
          askpass="$RUNNER_TEMP/badge-askpass.sh"
          # The single quotes are deliberate: $1 and $GITHUB_TOKEN belong to
          # the helper git runs, not to this step.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *[Uu]sername*) echo x-access-token ;;' \
            '  *) printf "%s\n" "$GITHUB_TOKEN" ;;' \
            'esac' > "$askpass"
          chmod +x "$askpass"
          trap 'rm -f "$askpass"' EXIT
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges "$url" badge-repo
          else
            git init -q -b badges badge-repo
            git -C badge-repo remote add origin "$url"
          fi
          cp "$RUNNER_TEMP/coverage.svg" badge-repo/
          cd badge-repo
          # The clone carries its own origin, and it is already the
          # credential-free URL; the fresh repo has just been given the same
          # one. Neither needs rewriting, so the token never reaches a remote
          # entry on disk.
          git config user.name "hordeforge-ci"
          git config user.email "ci@hordeforge.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "update coverage badge"
          git push origin badges
