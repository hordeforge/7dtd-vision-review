name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a fresh push cancels the superseded in-progress run
# instead of queueing duplicate parallel jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the pipeline only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # macOS is a claimed platform for the published wheel, so it is
          # tested rather than asserted. One interpreter is enough to catch a
          # case-sensitive path, a locale-encoding, or a filesystem-behavior
          # assumption that Linux hides; the version matrix stays on Ubuntu,
          # where the three interpreters matter most.
          - os: macos-latest
            python-version: "3.13"
    steps:
      # The shared composite action owns the environment build and the gate
      # invocations, so the release workflow runs the identical suite.
      - uses: ./.github/actions/test-suite
        with:
          python-version: ${{ matrix.python-version }}

  coverage-badge:
    # Publishes the line-coverage badge to the badges branch, which
    # raw.githubusercontent serves to the README. Main pushes only: a PR gets
    # its verdict from the test job and never sees the write token this job
    # needs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.13"
      - run: uv sync --locked
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: make badge BADGE="$RUNNER_TEMP/coverage.svg"
      - name: Publish the badge to the badges branch
        # scripts/publish_badge.sh owns the askpass helper and the push, so
        # `make lint-shell` analyzes the credential path instead of a here-doc
        # in this file. It reads GITHUB_TOKEN from the environment, never from
        # argv (THREAT_MODEL T9).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/publish_badge.sh "$RUNNER_TEMP/coverage.svg"
