name: release

# Tag-driven releases, same shape as the other hordeforge projects: pushing
# vX.Y.Z re-runs the suite on the tagged tree, then publishes a GitHub Release
# carrying the sdist and wheel built from exactly that tree.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.13
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # Same smoke target the CI workflow runs: the installed console script,
      # not only the source tree, and the capability registry with it.
      - run: make smoke
      - run: make check test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The published artifact version must equal the tag, so a wheel can
      # never claim a version nobody tagged. src/deadeye/_version.py is a
      # mirror and is checked against the same tag rather than trusted.
      - name: Check the tag matches pyproject.toml and _version.py
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) echo "ERROR: tag '$TAG' does not start with 'v'" >&2; exit 1;; esac
          PYPROJECT="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          MIRROR="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/deadeye/_version.py | head -1)"
          if [ -z "$PYPROJECT" ]; then
            echo "ERROR: no version = \"...\" line found in pyproject.toml" >&2
            exit 1
          fi
          if [ "$PYPROJECT" != "${TAG#v}" ]; then
            echo "ERROR: tag $TAG but pyproject.toml says version $PYPROJECT; make them match before tagging" >&2
            exit 1
          fi
          if [ "$MIRROR" != "$PYPROJECT" ]; then
            echo "ERROR: pyproject.toml says $PYPROJECT but src/deadeye/_version.py says $MIRROR" >&2
            exit 1
          fi
          echo "ok: tag $TAG matches pyproject.toml and _version.py ($PYPROJECT)"

      # SOURCE_DATE_EPOCH pinned to the tagged commit: setuptools stamps
      # wheel entries from it, so rebuilding the same tag yields
      # byte-identical wheels. Without it no two builds agree.
      - name: Build the sdist and wheel
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=format:%ct)"
          echo "building with SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          uv build
          # setuptools does not apply the epoch to sdists (tar members keep
          # checkout mtimes and the builder's uid leaks in), so canonicalize
          # them with the same pinned value; see scripts/reproducible_artifacts.py.
          python3 scripts/reproducible_artifacts.py dist

      # A CycloneDX 1.5 inventory of exactly what the committed uv.lock
      # resolves to, attached beside the artifacts so consumers and
      # vulnerability scanners see what shipped without parsing the wheel.
      - run:
          uv export --preview-features sbom-export --format cyclonedx1.5
          --no-dev --all-extras -o dist/sbom.cdx.json

      # The release notes are the changelog section for this version, so
      # consumers read what changed in the release itself and a version with
      # no changelog entry is visible instead of silently generic.
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DEFAULT_NOTES="HordeForge Release ${TAG}: shared vision-model review gateway returning structured, hash-addressed, advisory evidence on a clip under its recorded intent.

          See CHANGELOG.md in the tagged tree for the consumer-visible changes."
          if python3 scripts/release_notes.py "$VERSION" > "$RUNNER_TEMP/release-notes.md"; then
            echo "release notes: from the CHANGELOG.md ${VERSION} section"
          else
            code=$?
            if [ "$code" -ne 3 ]; then
              exit "$code"
            fi
            echo "WARNING: no CHANGELOG.md section for ${VERSION}; using the default note. Rename '## Unreleased' to '## ${VERSION}' before tagging." >&2
            printf '%s\n' "$DEFAULT_NOTES" > "$RUNNER_TEMP/release-notes.md"
          fi
          # Convergent on re-run: a failed attempt that already created the
          # release (assets missing or partial) must not wedge the next run
          # on "already exists". Create only when absent, then always upload
          # with --clobber so both paths end with the same complete set.
          if gh release view "$TAG" --json id -q .id >/dev/null 2>&1; then
            echo "release $TAG already exists; replacing its assets"
          else
            gh release create "$TAG" \
              --title "Deadeye / Vision Review ${VERSION}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/sbom.cdx.json --clobber
