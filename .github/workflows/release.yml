name: release

# Tag-driven releases, same shape as the other hordeforge projects: pushing
# vX.Y.Z re-runs the suite on the tagged tree, then publishes a GitHub Release
# carrying the sdist and wheel built from exactly that tree.

on:
  push:
    tags: ["v*"]

# One run per tag, and never cancelled: a re-pushed or re-run tag waits for the
# run in flight instead of racing it onto the same release assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The shared composite action owns the environment build and the gate
      # invocations, exactly as in the CI workflow. No python-version input:
      # the action reads .python-version, which keeps that file the single home
      # for the interpreter a tag is published against.
      - uses: ./.github/actions/test-suite

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # The SBOM export below is a preview feature, so the uv that runs it
          # is a build input like any other: pinned to the floor
          # `[tool.uv] required-version` names, and bumped with it.
          version: "0.12.13"

      # The published artifact version must equal the tag, so a wheel can
      # never claim a version nobody tagged. src/deadeye/_version.py is a
      # mirror and is checked against the same tag rather than trusted.
      - name: Check the tag matches pyproject.toml and _version.py
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) echo "ERROR: tag '$TAG' does not start with 'v'" >&2; exit 1;; esac
          PYPROJECT="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          MIRROR="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/deadeye/_version.py | head -1)"
          if [ -z "$PYPROJECT" ]; then
            echo "ERROR: no version = \"...\" line found in pyproject.toml" >&2
            exit 1
          fi
          if [ "$PYPROJECT" != "${TAG#v}" ]; then
            echo "ERROR: tag $TAG but pyproject.toml says version $PYPROJECT; make them match before tagging" >&2
            exit 1
          fi
          if [ "$MIRROR" != "$PYPROJECT" ]; then
            echo "ERROR: pyproject.toml says $PYPROJECT but src/deadeye/_version.py says $MIRROR" >&2
            exit 1
          fi
          echo "ok: tag $TAG matches pyproject.toml and _version.py ($PYPROJECT)"

      # `make dist` is the one build command, shared with contributors: the
      # tagged commit's SOURCE_DATE_EPOCH and the pinned LC_ALL, TZ, and
      # PYTHONHASHSEED live in the Makefile, so a published artifact and a
      # local `make dist` cannot drift apart. `make dist-verify` then rebuilds
      # the same tree under a different clock, locale, timezone, and hash seed
      # and diffs the bytes, so the reproducibility claim is checked here
      # rather than only asserted in a comment.
      - name: Build the sdist and wheel
        run: make dist
      - name: Verify the artifacts rebuild byte for byte
        run: make dist-verify

      # A CycloneDX 1.5 inventory of exactly what the committed uv.lock
      # resolves to, attached beside the artifacts so consumers and
      # vulnerability scanners see what shipped without parsing the wheel.
      # --locked makes that claim checkable: without it uv re-resolves and the
      # inventory describes whatever the index served, not the committed lock.
      - run:
          uv export --locked --preview-features sbom-export --format cyclonedx1.5
          --no-dev --all-extras -o dist/sbom.cdx.json
      # `make dist` wrote SHA256SUMS over the wheel and the sdist. The SBOM is
      # built here, after that manifest, so it is appended rather than
      # regenerated: every asset a consumer can download is then named in one
      # file they can check with a single `sha256sum -c`.
      - run: (cd dist && sha256sum sbom.cdx.json >> SHA256SUMS)

      # The release notes are the changelog section for this version, so
      # consumers read what changed in the release itself and a version with
      # no changelog entry is visible instead of silently generic.
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DEFAULT_NOTES="HordeForge Release ${TAG}: shared vision-model review gateway returning structured, hash-addressed, advisory evidence on a clip under its recorded intent.

          See CHANGELOG.md in the tagged tree for the consumer-visible changes."
          if python3 scripts/release_notes.py "$VERSION" > "$RUNNER_TEMP/release-notes.md"; then
            echo "release notes: from the CHANGELOG.md ${VERSION} section"
          else
            code=$?
            if [ "$code" -ne 3 ]; then
              exit "$code"
            fi
            echo "WARNING: no CHANGELOG.md section for ${VERSION}; using the default note. Rename '## Unreleased' to '## ${VERSION}' before tagging." >&2
            printf '%s\n' "$DEFAULT_NOTES" > "$RUNNER_TEMP/release-notes.md"
          fi
          # Convergent on re-run: a failed attempt that already created the
          # release (assets missing or partial) must not wedge the next run
          # on "already exists". Create only when absent, then always upload
          # with --clobber so both paths end with the same complete set.
          #
          # Convergent is not the same as silent. An asset the release already
          # carries must be byte-identical to the file about to replace it, so
          # a re-run after a partial failure still finishes while a re-pushed
          # tag that would swap the published bytes for a different build
          # stops here instead (THREAT_MODEL T10). The build is reproducible,
          # so the same tag and tree can only disagree for a real reason.
          if gh release view "$TAG" --json id -q .id >/dev/null 2>&1; then
            echo "release $TAG already exists; replacing its assets"
            published="$RUNNER_TEMP/published"
            mkdir -p "$published"
            differs=0
            for asset in dist/*.whl dist/*.tar.gz dist/sbom.cdx.json dist/SHA256SUMS; do
              name="$(basename "$asset")"
              # A pattern that matches nothing exits non-zero: the asset was
              # never published, which is the partial-release case this step
              # exists to finish, not a conflict.
              if gh release download "$TAG" --pattern "$name" --dir "$published" >/dev/null 2>&1 \
                && ! cmp -s "$asset" "$published/$name"; then
                echo "ERROR: published asset $name differs from what this tag builds." >&2
                echo "       Consumers have already downloaded it; delete the" >&2
                echo "       release and re-tag to publish the new bytes." >&2
                differs=1
              fi
            done
            if [ "$differs" -ne 0 ]; then
              exit 1
            fi
          else
            gh release create "$TAG" \
              --title "Deadeye / Vision Review ${VERSION}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/sbom.cdx.json dist/SHA256SUMS --clobber
