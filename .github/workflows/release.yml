name: release

# Tag-driven releases, same shape as the other hordeforge projects: pushing
# vX.Y.Z re-runs the suite on the tagged tree, then publishes a GitHub Release
# carrying the sdist and wheel built from exactly that tree.

on:
  push:
    tags: ["v*"]

# One run per tag, and never cancelled: a re-pushed or re-run tag waits for the
# run in flight instead of racing it onto the same release assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The shared composite action owns the environment build and the gate
      # invocations, exactly as in the CI workflow. No python-version input:
      # the action reads .python-version, which keeps that file the single home
      # for the interpreter a tag is published against.
      - uses: ./.github/actions/test-suite

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # The SBOM export below is a preview feature, so the uv that runs it
          # is a build input like any other: pinned to the floor
          # `[tool.uv] required-version` names, and bumped with it.
          version: "0.12.13"

      # The published artifact version must equal the tag, so a wheel can
      # never claim a version nobody tagged. src/deadeye/_version.py is a
      # mirror and is checked against the same tag rather than trusted.
      # A script under scripts/ so `make lint-shell` covers it, and so the
      # check can be rehearsed on a local tag before it is pushed.
      - name: Check the tag matches pyproject.toml and _version.py
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: scripts/check_release_tag.sh

      # `make dist` is the one build command, shared with contributors: the
      # tagged commit's SOURCE_DATE_EPOCH and the pinned LC_ALL, TZ, and
      # PYTHONHASHSEED live in the Makefile, so a published artifact and a
      # local `make dist` cannot drift apart. `make dist-verify` then rebuilds
      # the same tree under a different clock, locale, timezone, and hash seed
      # and diffs the bytes, so the reproducibility claim is checked here
      # rather than only asserted in a comment.
      - name: Build the sdist and wheel
        run: make dist
      - name: Verify the artifacts rebuild byte for byte
        run: make dist-verify
      # Byte-identical bytes are not yet a working install: the suite above
      # imports the checkout, so a module the package does not carry, a data
      # file MANIFEST.in dropped, or an entry point naming something the wheel
      # does not install all pass every other gate and fail the consumer's
      # first `uv tool install`. Installing the wheel that is about to be
      # uploaded and running its entry points is the last check before the
      # release exists.
      - name: Install the built wheel and run its entry points
        run: make dist-smoke

      # A CycloneDX 1.5 inventory of exactly what the committed uv.lock
      # resolves to, attached beside the artifacts so consumers and
      # vulnerability scanners see what shipped without parsing the wheel.
      # --locked makes that claim checkable: without it uv re-resolves and the
      # inventory describes whatever the index served, not the committed lock.
      - run:
          uv export --locked --preview-features sbom-export --format cyclonedx1.5
          --no-dev --all-extras -o dist/sbom.cdx.json
      # `make dist` wrote SHA256SUMS over the wheel and the sdist. The SBOM is
      # built here, after that manifest, so it is appended rather than
      # regenerated: every asset a consumer can download is then named in one
      # file they can check with a single `sha256sum -c`.
      - run: (cd dist && sha256sum sbom.cdx.json >> SHA256SUMS)

      # Create the release, or converge onto the one an earlier attempt left,
      # and upload the assets. The logic lives in scripts/publish_release.sh
      # so `make lint-shell` covers the token path and the asset-comparison
      # loop rather than a here-doc no analyzer can read.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: scripts/publish_release.sh
