# Shared deadeye configuration (committed). Secrets and machine-local
# overrides go in config.local.toml (gitignored), which wins on conflict.
# Command-line review options override the configured equivalents. Provider
# credentials prefer environment variables, then this merged configuration;
# config.local.toml wins over this file for every configured setting. Copy
# config.local.toml.example to config.local.toml and put your provider key
# there instead of exporting it per shell.

# The provider `review` uses when --provider is omitted.
default_provider = "gemini"

# The model `review` uses when --model is omitted. Overrides the selected
# provider's own model (which falls back to the built-in default). Leave
# unset to keep each provider's default.
# default_model = ""

# Seconds to wait for a provider when --timeout is omitted. A positive
# number; zero, negative, or non-numeric values are refused at start.
timeout_seconds = 120

# Per-provider settings. `model` overrides the built-in default model for
# that provider; `endpoint` overrides the fixed API root (rare, for a
# self-hosted proxy); the generation parameters are the NVIDIA omni-model
# defaults. Each key here is a fallback: config.local.toml can override it.
[providers.gemini]
model = "gemini-2.5-flash"
# Output-token ceiling per review; the built-in default is the model's
# published maximum. It stops a runaway generation from billing without
# end; it is not a tuning knob for answer quality.
# max_output_tokens = 65536

[providers.nvidia]
model = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
endpoint = "https://integrate.api.nvidia.com/v1/chat/completions"
max_tokens = 65536
reasoning_budget = 16384
temperature = 0.6
top_p = 0.95
