[build-system]
# Pinned to the exact version the committed uv.lock resolves (the dev group
# carries the same pin): a floating `>=77` here would let every isolated
# `uv build` resolve whatever setuptools shipped that week, so the same tag
# could produce different bytes in June and July. Bump both pins together.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "7dtd-vision-review"
version = "0.1.1"
description = "deadeye: shared vision-model review gateway for hordeforge: forward frames or a muxed clip plus recorded intent to a vision model and get structured, advisory feedback"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ywy50" }]
keywords = ["7-days-to-die", "7dtd", "vision", "gemini", "asset-review", "modding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  # One classifier per minor the release gate actually runs (.github/workflows/ci.yml
  # tests this list on Ubuntu, plus 3.13 on macOS). tests/test_release_contract.py
  # fails when the matrix grows and this list does not follow, so a published
  # wheel never claims support for an interpreter nothing tested.
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  # PEP 561: the wheel ships py.typed and the package is strict-mypy clean.
  "Typing :: Typed",
]

# The core has no runtime dependencies: adapters speak HTTP with the standard
# library, the same supply-chain posture the sibling asset pipeline keeps. A
# consuming tool that already carries no SDK has no reason to grow one.
[dependency-groups]
# Tool versions are load-bearing: ruff/mypy verdicts, pytest collection,
# coverage reports, and Hypothesis examples change between releases, so
# every checkout and every CI job must agree on exactly one of each.
# Declared here (PEP 735) so the pins have a single home and land in uv.lock,
# which `uv sync --locked` verifies on every install. Ranges would let a
# lock-less `uv sync` (or an isolated extra install) pick a newer major.
dev = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    # Exact pin, mirrored in [build-system]: the artifact-contract suite
    # builds real sdists and wheels, and an isolated `uv build` installs this
    # same version into its fresh environment. One backend version everywhere;
    # bump both pins together.
    "setuptools==84.0.0",
    "pytest==9.1.1",
    "coverage==7.16.1",
    "hypothesis==6.168.1",
]

[tool.uv]
# The resolver is a dependency like any other, and this tree leans on it: the
# lock carries a revision this uv reads, and the release job exports the SBOM
# through `uv export --preview-features sbom-export`, a preview flag uv is free
# to rename. CI installs the exact version named in
# `.github/actions/test-suite`; this floor is what stops an older uv on a
# contributor's machine from re-resolving the lock into something else, or
# failing on a flag it never had, halfway through a release.
required-version = ">=0.12.13"

[project.scripts]
deadeye = "deadeye.cli:main"

[project.urls]
Homepage = "https://github.com/hordeforge/7dtd-vision-review#readme"
Repository = "https://github.com/hordeforge/7dtd-vision-review"
Issues = "https://github.com/hordeforge/7dtd-vision-review/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: the package is fully typed under strict mypy; the marker is what
# tells a consumer's type checker to trust the inline annotations.
[tool.setuptools.package-data]
# The example is the one home for the config schema, and it ships in the
# wheel: a user who installs the release artifact has no checkout to copy it
# from, and `deadeye doctor` points at this file.
deadeye = ["py.typed", "config.local.toml.example"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors: runtime syntax, imports, and the hard 100-col cap
  "W",    # pycodestyle warnings (trailing whitespace, missing newline)
  "F",    # pyflakes: unused imports, undefined names, f-string bugs
  "B",    # flake8-bugbear: mutable defaults, zip strictness, binding bugs
  "UP",   # pyupgrade: modernize to the supported Python floor
  "SIM",  # flake8-simplify: collapsible branches and exception handling
  "N",    # pep8-naming
  "PL",   # pylint conventions and errors
  "BLE",  # blind except: bare `except Exception` must be justified inline
  "S",    # bandit: subprocess, temp files, XML parsing, URL schemes
  "RUF",  # ruff-specific: unused-noqa hygiene, sorted __all__
  "C4",   # comprehensions over manual accumulation
  "I",    # import sorting
  # Correctness and hygiene groups the whole tree already passes; each was
  # proven clean by a run before being pinned here.
  "A",     # flake8-builtins: shadowing a builtin is a latent bug
  "ARG",   # flake8-unused-arguments: a parameter taken and never read is a
           # wiring mistake, and in a callback or hook it hides the fact that
           # the value never reached the code that needed it
  "ASYNC", # blocking calls inside async code
  "DTZ",   # naive datetimes: every datetime here must be tz-explicit
  "EXE",   # executable-bit and shebang consistency for scripts
  "FBT",   # boolean traps on positional parameters
  "FLY",   # join() over concatenated literals
  "G",     # logging call format-string mistakes
  "ICN",   # import conventions
  "INT",   # gettext i18n mistakes
  # An unparenthesized concatenation inside a list or dict is a missing comma
  # with no other symptom, and ISC004 is the rule that catches it.
  "ISC",   # implicit string concatenation
  "PGH",   # blanket noqa / untyped type:ignore are forbidden
  "PIE",   # unnecessary constructs (duplicate kwargs, useless classes)
  "PERF",  # perflint: accidental quadratic patterns
  "PTH",   # pathlib over os.path string surgery
  "ERA",   # commented-out code must not survive a commit
  "FURB",  # refurb: cleaner stdlib idioms for common operations
  "FIX",   # unresolved FIXME markers cannot silently accumulate
  "LOG",   # logging call hygiene (exc_info, warn vs warning)
  "RET",   # redundant returns and collapsible return paths
  "RSE",   # needless parens on raised exceptions
  "SLOT",  # __slots__ where a class declares it
  "T10",   # debugger imports/calls never reach a commit
  "YTT",   # sys.version comparisons that break on future Pythons
]
ignore = [
  # Function-scope imports are deliberate architecture: optional adapters
  # import lazily so `--help`, `doctor`, and offline runs stay fast and never
  # touch the network.
  "PLC0415",
  # Structural-complexity ceilings. Measured: 13 sites across seven files
  # (review.py, providers/_http.py, result.py, mcp.py, evidence.py, cli.py,
  # scripts/doctor_query.py), not the one dispatcher an earlier revision of this
  # comment named. Splitting them is a code-review decision, not a gate this
  # repo has earned yet. Re-measure with
  # `ruff check --select PLR0911,PLR0912,PLR0913,PLR0915,PLR0917 --statistics .`
  # before narrowing this to per-file-ignores.
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
  # Magic-value comparisons fire on the domain constants (limits, versions).
  "PLR2004",
  # S603 fires on every subprocess.run regardless of arguments. Nothing here
  # ever passes shell=True (S602 stays armed), so the useful signal is in
  # S602/S607, not S603.
  "S603",
]

[tool.ruff.lint.per-file-ignores]
# The suite asserts with `assert`; bandit's S101 is for production paths.
# ARG is off here because a test signature is driven by pytest: a fixture is
# requested to prove the fixture works, and a stub callback keeps the provider
# signature it stands in for. Neither is a wiring mistake in the code under
# test, which is where ARG stays armed.
"tests/**" = ["S101", "ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
# Beyond strict: flag code paths the type system cannot reach and variable
# uses that can precede assignment on some branch. Both proven clean by a
# run before being pinned here.
warn_unreachable = true
enable_error_code = [
  "possibly-undefined", # a use that some branch can reach before assignment
  "truthy-bool",        # objects whose __bool__ is always True used as conditions
  "redundant-expr",     # a check one side already guarantees
  "deprecated",         # calls into deprecated API surfaces
  "ignore-without-code", # every silence must name the finding it silences
]
# The test files are runtime-asserted by pytest, not statically checked; the
# strict contract applies to the shipped package plus the scripts CI itself
# executes (coverage badge, release notes), which already type-check clean.
# mypy 2.3 cannot relax a strict flag for one module (a per-module
# `disallow_untyped_defs = false` is ignored, however it is spelled), so
# extending the run to tests needs a repo-wide annotation sweep first.
files = ["src", "scripts"]
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
